<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDV</title>
    <link rel="stylesheet" href="./pages/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <nav class="profile">
          <img src="" alt="" class="profile__img" />
          <h2 class="profile__title">Julian Ferrero</h2>
          <p class="profile__job">Marketing</p>
          <button class="profile__button">Editar</button>
        </nav>
      </header>
      <main></main>
      <footer></footer>
      <div class="popup">
        <h3 class="popup__tittle">Editar Perfil</h3>
        <button class="popup__button-close"></button>
        <form class="popup__form">
          <fieldset>
            <label for="name">Nome ou Apelido</label>
            <input
              class="popup__name"
              type="text"
              id="name"
              placeholder="Juliano Ferrero"
            />
            <label for="profession">Cargo e Profissao</label>
            <input
              class="popup__job"
              type="text"
              id="profession"
              placeholder="Marketing"
            />
          </fieldset>
          <button type="submit" class="popup__perfil-button-save"></button>
        </form>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
